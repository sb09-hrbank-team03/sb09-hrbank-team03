server:
  port: ${PORT:8080}
hr_bank:
  storage:
    type: local
    local:
      root-path: ./storage
    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hrbank
    username: hrbank_user
    password: hrbank1234
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # create / validate
    show-sql: false
    defer-datasource-initialization: true
  application:
    name: hr_bank

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

backup:
  schedule: 3600000